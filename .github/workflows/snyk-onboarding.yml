name: Snyk Team Onboarding Automation

on:
  # Trigger on push to main branch
  push:
    branches: [main]
  
  # Trigger on pull request
  pull_request:
    branches: [main]
  
  # Manual trigger with inputs
  workflow_dispatch:
    inputs:
      team_name:
        description: 'Name of the team to onboard'
        required: true
        type: string
      repositories:
        description: 'Comma-separated list of repositories (owner/repo format)'
        required: true
        type: string
      members:
        description: 'Comma-separated list of member emails'
        required: true
        type: string
      testing_types:
        description: 'Comma-separated testing types (sast,sca,iac,container)'
        required: false
        default: 'sast,sca'
        type: string
      policies:
        description: 'Comma-separated policy names'
        required: false
        default: 'high-severity-policy,license-policy'
        type: string

  # Trigger via webhook
  repository_dispatch:
    types: [snyk-onboard-team, snyk-bulk-onboard]

env:
  PYTHON_VERSION: '3.9'

jobs:
  onboard-team:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'snyk-onboard-team'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Prepare team configuration
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          # Manual trigger - use inputs
          TEAM_NAME="${{ github.event.inputs.team_name }}"
          REPOSITORIES="${{ github.event.inputs.repositories }}"
          MEMBERS="${{ github.event.inputs.members }}"
          TESTING_TYPES="${{ github.event.inputs.testing_types }}"
          POLICIES="${{ github.event.inputs.policies }}"
        else
          # Repository dispatch - use client payload
          TEAM_NAME="${{ github.event.client_payload.team_name }}"
          REPOSITORIES="${{ github.event.client_payload.repositories }}"
          MEMBERS="${{ github.event.client_payload.members }}"
          TESTING_TYPES="${{ github.event.client_payload.testing_types }}"
          POLICIES="${{ github.event.client_payload.policies }}"
        fi
        
        # Convert comma-separated strings to JSON arrays
        REPO_ARRAY=$(echo "$REPOSITORIES" | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip().split(',')))")
        MEMBER_ARRAY=$(echo "$MEMBERS" | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip().split(',')))")
        TESTING_ARRAY=$(echo "$TESTING_TYPES" | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip().split(',')))")
        POLICY_ARRAY=$(echo "$POLICIES" | python3 -c "import sys, json; print(json.dumps(sys.stdin.read().strip().split(',')))")
        
        # Create temporary config file
        cat > temp_team_config.json << EOF
        {
          "teams": [
            {
              "team_name": "$TEAM_NAME",
              "repositories": $REPO_ARRAY,
              "members": $MEMBER_ARRAY,
              "testing_types": $TESTING_ARRAY,
              "policies": $POLICY_ARRAY
            }
          ]
        }
        EOF
        
        echo "Created team configuration:"
        cat temp_team_config.json
    
    - name: Run Snyk onboarding
      env:
        SNYK_API_TOKEN: ${{ secrets.SNYK_API_TOKEN }}
        SNYK_GROUP_ID: ${{ secrets.SNYK_GROUP_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Use temporary config file
        mv temp_team_config.json teams_config.json
        python enhanced_snyk_automation.py
    
    - name: Upload results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: onboarding-results
        path: |
          *.log
          teams_config.json

  bulk-onboard:
    runs-on: ubuntu-latest
    if: github.event.action == 'snyk-bulk-onboard'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Prepare bulk configuration
      run: |
        # Use the teams configuration from the payload
        echo '${{ toJson(github.event.client_payload.teams_config) }}' > teams_config.json
        echo "Created bulk team configuration:"
        cat teams_config.json
    
    - name: Run bulk Snyk onboarding
      env:
        SNYK_API_TOKEN: ${{ secrets.SNYK_API_TOKEN }}
        SNYK_GROUP_ID: ${{ secrets.SNYK_GROUP_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python enhanced_snyk_automation.py
    
    - name: Upload results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bulk-onboarding-results
        path: |
          *.log
          teams_config.json

  notify-results:
    runs-on: ubuntu-latest
    needs: [onboard-team, bulk-onboard]
    if: always()
    
    steps:
    - name: Download results
      uses: actions/download-artifact@v3
      with:
        path: results
    
    - name: Notify completion
      run: |
        echo "Snyk onboarding automation completed"
        echo "Results available in artifacts"
        
        # Here you could add notifications to Slack, Teams, email, etc.
        # Example: Send to Slack webhook
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"Snyk onboarding completed for workflow run ${{ github.run_id }}"}' \
        #   ${{ secrets.SLACK_WEBHOOK_URL }}
